spring.datasource.url=jdbc:hsqldb:file:data/products
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Servlet context parameters. Spring Boot's embedded Tomcat does not parse
# WEB-INF/web.xml, so Faces configuration has to be declared here.
# MyFaces only bootstraps when it has seen the FacesServlet mapping declared in
# web.xml; Application registers the servlet programmatically instead, so tell
# MyFaces to initialize anyway.
server.servlet.context-parameters.org.apache.myfaces.INITIALIZE_ALWAYS_STANDALONE=true
server.servlet.context-parameters.jakarta.faces.PROJECT_STAGE=Development
server.servlet.context-parameters.primefaces.CLIENT_SIDE_VALIDATION=true
